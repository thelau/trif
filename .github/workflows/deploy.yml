name: Deploy to Prod
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - run: npm ci
    - run: npm run lint
    - run: npm run test
    - run: npm run build
    - run: sudo apt-get update && sudo apt-get install -y google-chrome-stable xvfb
    - run: |
        npm run preview &
        sleep 5
    - run: xvfb-run -a npm run audit
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1
    - run: aws s3 sync dist/ s3://trif.it --delete
    - run: aws cloudfront create-invalidation --distribution-id E3QCF2Q3K0Y270 --paths "/*"