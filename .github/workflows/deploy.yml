name: Deploy to Prod
# The site is offline. This workflow no longer runs on push;
# start it by hand from the Actions tab if TRIF goes back online.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - run: npm ci
    - run: npm run lint
    - run: npm run test
    - run: npm run build
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1
    - run: aws s3 sync dist/ s3://trif.it --delete
    - run: aws cloudfront create-invalidation --distribution-id E3QCF2Q3K0Y270 --paths "/*"